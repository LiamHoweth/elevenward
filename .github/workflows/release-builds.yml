name: Signed release artifacts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Artifact to build
        required: true
        type: choice
        options:
          - both
          - android
          - ios
      build_name:
        description: Public semantic version
        required: true
        default: 1.1.0
      build_number:
        description: Monotonically increasing store build number
        required: true
        default: '6'

permissions:
  contents: read

concurrency:
  group: elevenward-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.2'
  RELEASE_BUILD_NAME: ${{ inputs.build_name }}
  RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    environment: elevenward-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: python3 tool/validate_release_version.py "$RELEASE_BUILD_NAME" "$RELEASE_BUILD_NUMBER"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Require protected Android configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          API_URL: ${{ secrets.ELEVENWARD_API_BASE_URL }}
          GOOGLE_CLIENT: ${{ secrets.ELEVENWARD_GOOGLE_SERVER_CLIENT_ID }}
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_KEY }}
          CONTENT_KEY: ${{ secrets.ELEVENWARD_CONTENT_PUBLIC_KEY_BASE64 }}
        run: bash tool/require_release_environment.sh android
      - name: Install Android upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          key_path="$RUNNER_TEMP/elevenward-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$key_path"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Android App Bundle
        env:
          API_URL: ${{ secrets.ELEVENWARD_API_BASE_URL }}
          GOOGLE_CLIENT: ${{ secrets.ELEVENWARD_GOOGLE_SERVER_CLIENT_ID }}
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_KEY }}
          CONTENT_KEY: ${{ secrets.ELEVENWARD_CONTENT_PUBLIC_KEY_BASE64 }}
        run: >-
          flutter build appbundle --release
          --build-name="$RELEASE_BUILD_NAME"
          --build-number="$RELEASE_BUILD_NUMBER"
          --obfuscate
          --split-debug-info=build/symbols/android
          --dart-define-from-file=config/marketing.json
          --dart-define=ELEVENWARD_API_BASE_URL="$API_URL"
          --dart-define=ELEVENWARD_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT"
          --dart-define=REVENUECAT_ANDROID_PUBLIC_KEY="$REVENUECAT_KEY"
          --dart-define=ELEVENWARD_CONTENT_PUBLIC_KEY_BASE64="$CONTENT_KEY"
      - run: bash tool/check_release_assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: elevenward-android-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/android
          if-no-files-found: error
          retention-days: 30

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    environment: elevenward-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: python3 tool/validate_release_version.py "$RELEASE_BUILD_NAME" "$RELEASE_BUILD_NUMBER"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Require protected iOS configuration
        env:
          IOS_CERTIFICATE_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
          API_URL: ${{ secrets.ELEVENWARD_API_BASE_URL }}
          GOOGLE_CLIENT: ${{ secrets.ELEVENWARD_GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT: ${{ secrets.ELEVENWARD_GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT: ${{ secrets.ELEVENWARD_GOOGLE_REVERSED_CLIENT_ID }}
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_IOS_PUBLIC_KEY }}
          CONTENT_KEY: ${{ secrets.ELEVENWARD_CONTENT_PUBLIC_KEY_BASE64 }}
        run: bash tool/require_release_environment.sh ios
      - name: Install Apple distribution identity and profile
        env:
          IOS_CERTIFICATE_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/elevenward-distribution.p12"
          profile_path="$RUNNER_TEMP/elevenward.mobileprovision"
          keychain_path="$RUNNER_TEMP/elevenward-signing.keychain-db"
          printf '%s' "$IOS_CERTIFICATE_B64" | base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROFILE_B64" | base64 -D > "$profile_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/elevenward.mobileprovision"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed App Store IPA and symbols
        env:
          API_URL: ${{ secrets.ELEVENWARD_API_BASE_URL }}
          GOOGLE_CLIENT: ${{ secrets.ELEVENWARD_GOOGLE_SERVER_CLIENT_ID }}
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_IOS_PUBLIC_KEY }}
          CONTENT_KEY: ${{ secrets.ELEVENWARD_CONTENT_PUBLIC_KEY_BASE64 }}
        run: >-
          flutter build ipa --release
          --build-name="$RELEASE_BUILD_NAME"
          --build-number="$RELEASE_BUILD_NUMBER"
          --export-options-plist=ios/ExportOptions.plist
          --obfuscate
          --split-debug-info=build/symbols/ios
          --dart-define-from-file=config/production.json
          --dart-define-from-file=config/marketing.json
          --dart-define=ELEVENWARD_API_BASE_URL="$API_URL"
          --dart-define=ELEVENWARD_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT"
          --dart-define=REVENUECAT_IOS_PUBLIC_KEY="$REVENUECAT_KEY"
          --dart-define=ELEVENWARD_CONTENT_PUBLIC_KEY_BASE64="$CONTENT_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: elevenward-ios-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive/dSYMs
            build/symbols/ios
          if-no-files-found: error
          retention-days: 30
